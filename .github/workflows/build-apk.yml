name: Build Android APK

# 이 저장소에 코드를 push 하거나, GitHub 저장소 페이지의
# Actions 탭에서 "Run workflow" 버튼을 눌러 수동으로도 실행할 수 있습니다.
# 빌드가 끝나면 Actions 실행 결과 페이지 하단 "Artifacts"에서
# lotto-coffee-apk.zip을 내려받으면 그 안에 .apk 파일이 들어있습니다.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build APK with buildozer
        uses: ArtemSBulgakov/buildozer-action@v2
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lotto-coffee-apk
          path: ${{ steps.buildozer.outputs.filename }}
